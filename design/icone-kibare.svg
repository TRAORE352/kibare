<?xml version="1.0" encoding="UTF-8"?>
<!--
  Icône d'application Kibaré — redessinée pour la petite taille.

  Une icône n'est pas un logo rétréci. Dans le logo, les trois points et le
  cadenas sont proportionnés pour une lecture à grande taille ; réduits à
  48 px ils se confondent. Les mêmes éléments sont donc redessinés avec des
  proportions optiques : bulle plus compacte et plus haute, points agrandis,
  cadenas franchement dégagé du bord. Composition et couleurs restent celles
  du logo.

  Repère 120×120. Le dessin tient dans le cercle inscrit — zone sûre des
  icônes adaptatives Android, rognées selon la forme du lanceur.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">

  <!-- Bulle : 86 de large sur 62 de haut, centrée horizontalement.
       Plus compacte que la version précédente : le contenu respire. -->
  <path fill="#DB1E1D" d="
    M 32 26
    H 88
    a 15 15 0 0 1 15 15
    V 73
    a 15 15 0 0 1 -15 15
    H 55
    l -13 14
    V 88
    H 32
    a 15 15 0 0 1 -15 -15
    V 41
    a 15 15 0 0 1 15 -15
    Z" />

  <!-- Trois points, moitié gauche. -->
  <circle cx="34" cy="56" r="6.6" fill="#FFFFFF"/>
  <circle cx="51" cy="56" r="6.6" fill="#FFFFFF"/>
  <circle cx="68" cy="56" r="6.6" fill="#FFFFFF"/>

  <!-- Cadenas, moitié droite : bord droit à 95, soit 8 unités de marge
       sous la bulle (dont le bord est à 103). Il ne touche plus rien. -->
  <g fill="#FFFFFF">
    <path d="M 80 50
             a 8.5 8.5 0 0 1 17 0
             v 6
             h -5.5
             v -6
             a 3 3 0 0 0 -6 0
             v 6
             H 80
             Z"/>
    <rect x="77.5" y="55" width="22" height="19" rx="4"/>
  </g>
  <circle cx="88.5" cy="62.5" r="2.9" fill="#DB1E1D"/>
  <rect x="87.2" y="62.5" width="2.6" height="5.6" rx="1.3" fill="#DB1E1D"/>

</svg>
