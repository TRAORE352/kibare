{% extends "base.html" %}
{% block title %}Enrôler un agent — Console Kibaré{% endblock %}
{% block content %}
<h1>Enrôler un agent</h1>
<p class="muted">Crée le compte (Keycloak + Matrix) et génère un lien d'activation à usage unique.</p>
<form method="post" action="/console/agents/enroll" class="form">
  <label>Matricule <input name="matricule" required minlength="3"></label>
  <label>Prénom <input name="prenom" required></label>
  <label>Nom <input name="nom" required></label>
  <label>Ministère
    <select name="ministere" required>
      {% for m in ministeres %}<option value="{{ m }}">{{ m }}</option>{% endfor %}
    </select>
  </label>
  <label>Direction <input name="direction" required></label>
  <label>Service <input name="service"></label>
  <label>Fonction <input name="fonction" required></label>
  <label>Rôle
    <select name="role">
      {% for r in roles %}<option value="{{ r }}">{{ r }}</option>{% endfor %}
    </select>
  </label>
  <button class="btn" type="submit">Enrôler</button>
</form>
{% endblock %}
