#
# Thème de connexion Kibaré
#
# POURQUOI HÉRITER plutôt que réécrire : la page de connexion Keycloak porte
# la logique d'authentification (erreurs, OTP, réinitialisation, jetons CSRF).
# Réécrire les templates FreeMarker, c'est reprendre cette logique à sa charge
# et la casser à la première montée de version. On hérite donc de keycloak.v2
# et on ne surcharge QUE l'apparence : aucune ligne de comportement modifiée.
#
parent=keycloak.v2
import=common/keycloak

# ATTENTION — `styles` REMPLACE la valeur du parent, il ne s'y ajoute pas :
# le gabarit boucle sur `properties.styles?split(' ')`. Omettre css/styles.css
# ici livrerait une page sans la feuille de base de Keycloak (mise en page
# PatternFly absente, champs empilés sans structure). On répète donc la valeur
# du parent AVANT la nôtre, pour que kibare.css surcharge en dernier.
styles=css/styles.css css/kibare.css

# `stylesCommon` n'est pas redéclaré : il reste hérité de keycloak.v2
# (PatternFly v5), que notre feuille surcharge.
